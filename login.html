            {
                var username=document.forms["f1"]
                ["username"].value;
                var password=document.forms["f1"]
                ["password"].value;
                if(username.trim()==="")
            {
                alter("Username cannot be empty");//Prevents form submission
            }
            if(password.length<6)
            {
                alter("Password must be at least 6 characters long");
                return false;
            }
            return true;
            }
